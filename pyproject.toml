[project]
name = "wsjtx-mcp"
version = "0.1.4"
description = "An MCP server that lets Claude and other AI assistants operate WSJT-X (FT8, FT4 and the other weak-signal modes) over its UDP message protocol."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Stefan Brunner (AE5VG)", email = "me@stefanbrunner.org" },
]
keywords = [
    "wsjtx",
    "ft8",
    "ft4",
    "mcp",
    "model-context-protocol",
    "ham-radio",
    "amateur-radio",
    "weak-signal",
    "jt65",
    "msk144",
    "q65",
    "wspr",
    "claude",
    "ai-assistant",
    "ai-agent",
    "llm",
    "ae5vg",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.2.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
wsjtx-mcp = "wsjtx_mcp.server:main"

[project.urls]
Homepage = "https://ae5vg.com/products/wsjtx-mcp.html"
Documentation = "https://github.com/sbrunner-atx/wsjtx-mcp#readme"
Repository = "https://github.com/sbrunner-atx/wsjtx-mcp"
Issues = "https://github.com/sbrunner-atx/wsjtx-mcp/issues"
Changelog = "https://github.com/sbrunner-atx/wsjtx-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsjtx_mcp"]

# Ruff is a fast linter/formatter; configuring it here is a sign of a maintained
# project. We run it in CI.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["livecheck.py", "make_icon.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
