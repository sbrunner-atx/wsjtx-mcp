[project]
name = "wsjtx-mcp"
version = "0.1.1"
description = "An MCP server that controls WSJT-X (FT8/FT4/etc.) over its UDP message protocol."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Stefan Brunner (AE5VG)", email = "me@stefanbrunner.org" },
]
keywords = [
    "wsjtx",
    "ft8",
    "ft4",
    "mcp",
    "model-context-protocol",
    "ham-radio",
    "amateur-radio",
    "weak-signal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "mcp[cli]>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
wsjtx-mcp = "wsjtx_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sbrunner-atx/wsjtx-mcp"
Repository = "https://github.com/sbrunner-atx/wsjtx-mcp"
Issues = "https://github.com/sbrunner-atx/wsjtx-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsjtx_mcp"]

# Ruff is a fast linter/formatter; configuring it here is a sign of a maintained
# project. We run it in CI.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["livecheck.py", "make_icon.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
