name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token needed, and
# builds the Claude Desktop extension (.mcpb) and attaches it to the release.
# Fires when you publish a GitHub Release (e.g. `gh release create vX.Y.Z`).
# The release tag's version must match pyproject.toml.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    # Pre-releases (rc tags, throwaway test tags) never go to PyPI: their tag
    # does not equal the plain project version the build would upload as.
    if: ${{ !github.event.release.prerelease }}
    permissions:
      id-token: write   # required for PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  # Builds the Claude Desktop extension (.mcpb) and attaches it to the release
  # that triggered this run. The ae5vg.com Downloads page reads the asset list
  # from the `releases/latest` API, so a release with no asset shows nothing.
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload a release asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the tag matches manifest.json, pyproject.toml and server.json
        # Pre-releases are exempt: an rc or throwaway test tag deliberately
        # does not equal the plain project version.
        if: ${{ !github.event.release.prerelease }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c 'import json;print(json.load(open("manifest.json"))["version"])')
          pyproject=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          registry=$(python3 -c 'import json;d=json.load(open("server.json"));print(d["version"],d["packages"][0]["version"])')
          echo "tag=$tag manifest=$manifest pyproject=$pyproject server.json=$registry"
          test "$tag" = "$manifest"
          test "$tag" = "$pyproject"
          for v in $registry; do test "$tag" = "$v" || exit 1; done
      - name: Build the desktop extension
        run: npx --yes @anthropic-ai/mcpb pack
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ./*.mcpb --clobber
