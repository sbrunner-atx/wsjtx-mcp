name: Publish to PyPI

# Publishes to PyPI via OpenID Connect "trusted publishing" — no API token.
# Triggered when a GitHub Release is published (e.g. `gh release create vX.Y.Z`).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment name" configured on PyPI's trusted publisher.
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
